services:

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: student_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager        # DB always on manager node
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword123"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  flask:
    image: kunalpawase/student-result-flask:latest
    environment:
      DB_HOST: mysql
      DB_USER: app_user
      DB_PASSWORD: securepassword123
      DB_ROOT_PASSWORD: rootpassword123
      DB_NAME: student_db
      FLASK_DEBUG: "0"
      SECRET_KEY: your-secret-key-change-in-production
    networks:
      - backend_network
      - frontend_network
    deploy:
      replicas: 3                       # 3 Flask replicas for load balancing
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: rolling-update           # zero-downtime rolling updates
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    networks:
      - frontend_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    depends_on:
      - flask

configs:
  nginx_config:
    file: ./nginx/nginx.conf

networks:
  backend_network:
    driver: overlay
    name: student_backend
  frontend_network:
    driver: overlay
    name: student_frontend

volumes:
  mysql_data:
    name: student_mysql_data
